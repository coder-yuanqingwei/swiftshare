name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- Toolchains ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK + platform
        run: |
          sdkmanager "platforms;android-35" \
                    "build-tools;35.0.0" \
                    "ndk;26.1.10909125"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core -> target

      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi

      # ---------- JS deps ----------
      - name: Install dependencies (app)
        working-directory: app
        run: npm install --legacy-peer-deps

      - name: Install dependencies (native-core)
        working-directory: native-core
        run: npm install --legacy-peer-deps

      # ---------- Rust core -> JNI libs + bindings ----------
      - name: Build Rust core + generate bindings (Android)
        working-directory: native-core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          npx ubrn build android --config ubrn.config.yaml --and-generate

      # ---------- Assemble APK ----------
      - name: Make gradlew executable
        working-directory: app/android
        run: chmod +x ./gradlew

      - name: Assemble release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # ---------- Deliverable ----------
      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK produced"
            exit 1
          fi
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: swiftshare-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub Release (on tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
