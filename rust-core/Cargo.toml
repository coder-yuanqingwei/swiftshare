[package]
name = "swiftshare-core"
version = "0.1.0"
edition = "2021"
description = "Shared transfer core for SwiftShare (BLE handshake + WiFi file transfer)"

[lib]
name = "swiftshare_core"
# staticlib: iOS/Xcode link; cdylib: Android JNI; rlib: host tests
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
uniffi = { version = "0.31", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "sync", "time", "fs"] }
axum = { version = "0.7", features = ["query", "multipart"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
thiserror = "1"
base64 = "0.22"
tokio-util = "0.7"
futures = "0.3"
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"

[[bin]]
name = "swiftshare-demo"
path = "src/bin/demo.rs"
